name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: extension/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      # Package metadata and extension manifests need a numeric version. Keep the
      # RC suffix in release asset names so downloads identify the candidate.
      - name: Take the version from the tag
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[1-9][0-9]*)?$ ]]; then
            echo "tag $GITHUB_REF_NAME must be vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi
          echo "VERSION=${release_version%%-*}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Install the Extension's dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build both extension bundles
        working-directory: extension
        run: node build.mjs --version "$VERSION"

      - name: Build the app and the installer package
        run: packaging/build-pkg.sh --version "$VERSION"

      - name: Pack the Chromium extension
        env:
          CHROMIUM_EXTENSION_KEY: ${{ secrets.CHROMIUM_EXTENSION_KEY }}
        run: |
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printenv CHROMIUM_EXTENSION_KEY > "$key"
          node tools/pack-crx.mjs \
            --zip extension/dist/chromium.zip \
            --key "$key" \
            --output "dist/enterprise-sso-bridge-$RELEASE_VERSION.crx"

      # Gecko installs the same zip; the extension is only the file name Zen's
      # Install Add-on From File picker expects.
      - name: Name the Gecko bundle as an add-on
        run: cp extension/dist/gecko.zip "dist/enterprise-sso-bridge-$RELEASE_VERSION.xpi"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-rc* ]]; then
            release_flags+=(--prerelease --latest=false)
            mv "dist/EnterpriseSSOBridge-$VERSION.pkg" "dist/EnterpriseSSOBridge-$RELEASE_VERSION.pkg"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}" \
            "dist/EnterpriseSSOBridge-$RELEASE_VERSION.pkg" \
            "dist/enterprise-sso-bridge-$RELEASE_VERSION.crx" \
            "dist/enterprise-sso-bridge-$RELEASE_VERSION.xpi" \
            packaging/install-chromium-extension.sh
